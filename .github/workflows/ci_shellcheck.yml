# Run the checks when a push changes a shell script. The job checks only the
# scripts changed by that push, including pushes with several commits.

name: ShellCheck

on:
  push:
    paths:
      - '*.sh'
      - '**/*.sh'

jobs:
  build:
    # Keep this on Ubuntu 24.04 so a change to GitHub's ubuntu-latest image does
    # not unexpectedly change the version of ShellCheck used for this job.
    runs-on: ubuntu-24.04

    steps:
      # Fetch the full history so Git can compare the branch before and after
      # the push. The default checkout fetches only the latest commit.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: check bash files
        env:
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          # On an existing branch, GitHub gives us the commit that was at the
          # tip before this push. That is the starting point for the comparison.
          base="$PUSH_BEFORE"
          if [[ $base == 0000000000000000000000000000000000000000 ]]; then
            # A new branch has no previous tip, so GitHub sends forty zeroes.
            # Start before the first commit in the push to include them all.
            # A branch created without new commits has nothing to check.
            first_commit=$(jq -r '.commits[0].id // empty' "$GITHUB_EVENT_PATH")
            if [[ -z $first_commit ]]; then
              echo "No commits were included in this push."
              exit 0
            fi
            if git rev-parse "$first_commit^" >/dev/null 2>&1; then
              base=$(git rev-parse "$first_commit^")
            else
              # The repository's first commit has no parent. Comparing it with
              # an empty tree lets Git treat all its files as newly added.
              base=$(git hash-object -t tree /dev/null)
            fi
          fi

          # Keep files that still exist after the push, including new, changed
          # and renamed files. Deleted files cannot be checked. NUL separators
          # also allow filenames containing spaces to be read safely below.
          changed_files=$(mktemp)
          git diff --name-only -z --diff-filter=ACMR "$base" "$GITHUB_SHA" > "$changed_files"

          # The path filter starts this job, but a push may contain other files
          # too. Skip those and run both checks on each changed shell script.
          err=0
          while IFS= read -r -d '' i; do
            [[ $i == *.sh ]] || continue
            echo "==================== $i"
            # Check the script's syntax without running it. Carry on after an
            # error so the job can report problems in the other changed scripts.
            if ! bash -n "$i"; then
              echo "bash found problem with $i"
              err=$((err + 1))
            fi
            this_err=0
            # Follow files sourced by this script. Keep the existing exclusions
            # for warnings this repository does not enforce. SC2317 is included
            # because ShellCheck has marked reachable code as unreachable here.
            shellcheck -x -e SC2004 -e SC2155 -e SC2181 -e SC2188 -e SC2024 -e SC2069 -e SC2269 -e SC2317 "$i" || this_err=1
            if [ ${this_err} -eq 1 ]; then
              err=$((err + 1))
            fi
          done < "$changed_files"
          # Finish with a failure if any changed script failed either check.
          if [ $err -ne 0 ]; then
            echo
            echo "bash and/or shellcheck found problems in scripts. Please fix it or add some excludes (-e SC....) here in this file."
            echo
          fi
          exit $err
